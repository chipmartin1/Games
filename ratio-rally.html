<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ratio Rally</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: graph-paper sheet, one working column; progress runs along a number line. */
:root{
  --bg:#F2F6FB; --grid:#DCE6F2; --ink:#14213D; --muted:#51607A;
  --surface:#FFFFFF; --line:#C5D2E3; --accent:#0B7A75; --accent-ink:#FFFFFF;
  --hot:#C75B12; --good:#12805C; --bad:#B3261E;
  --good-bg:#E3F4EC; --bad-bg:#FBE9E7; --hint-bg:#FFF3DC;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1626; --grid:#18253C; --ink:#E8EEF8; --muted:#9AABC6;
    --surface:#14203A; --line:#2A3B5A; --accent:#3CC4BC; --accent-ink:#06221F;
    --hot:#F29A55; --good:#55D3A0; --bad:#FF8E85;
    --good-bg:#11392C; --bad-bg:#3F1B19; --hint-bg:#3A2E14; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1626; --grid:#18253C; --ink:#E8EEF8; --muted:#9AABC6;
  --surface:#14203A; --line:#2A3B5A; --accent:#3CC4BC; --accent-ink:#06221F;
  --hot:#F29A55; --good:#55D3A0; --bad:#FF8E85;
  --good-bg:#11392C; --bad-bg:#3F1B19; --hint-bg:#3A2E14; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5;
  padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;
}
main{max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2.2rem,7vw,3.2rem);font-weight:800;letter-spacing:-.02em}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lede{color:var(--muted);max-width:52ch;margin:10px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}

/* start screen */
.levels{display:grid;gap:10px;margin-top:26px}
.lvl{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;width:100%}
.lvl:hover{border-color:var(--accent)}
.lvl .n{font-family:var(--display);font-weight:800;font-size:1.9rem;color:var(--accent);text-align:center;line-height:1}
.lvl b{display:block;font-family:var(--display);font-size:1.15rem}
.lvl span.d{color:var(--muted);font-size:.9rem}
.lvl .go{font-size:.8rem;font-weight:600;color:var(--muted)}
.lvl.all{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lvl.all .n,.lvl.all span.d,.lvl.all .go{color:var(--accent-ink)}
.lvl.all .d{opacity:.9}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat small{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{font-family:var(--display);font-size:1.4rem}
.stat.hot b{color:var(--hot)}
.quit{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px;font-size:.9rem}

/* number-line progress */
.line{position:relative;display:flex;justify-content:space-between;margin:6px 0 18px;padding:0 2px}
.line::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line);transform:translateY(-50%)}
.tick{position:relative;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tick.cur{border-color:var(--ink);transform:scale(1.25)}
.tick.g{background:var(--good);border-color:var(--good)}
.tick.o{background:var(--hot);border-color:var(--hot)}
.tick.m{background:var(--bad);border-color:var(--bad)}
.tick.gap{margin-left:10px}

/* question */
.qmeta{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
.q{font-size:1.2rem;line-height:1.55;margin:0 0 18px;max-width:58ch}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 .2em;font-size:.95em}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 .3em}
table.t{border-collapse:collapse;margin:4px 0 4px;font-variant-numeric:tabular-nums}
table.t th,table.t td{border:1px solid var(--line);padding:6px 16px;text-align:center;font-size:1.05rem}
table.t th{background:var(--grid);font-family:var(--display)}
.answer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.answer label{font-weight:600}
.field{display:flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:2px 12px}
.field:focus-within{border-color:var(--accent)}
.field input{font:inherit;font-family:var(--display);font-size:1.4rem;font-weight:700;width:9ch;border:0;background:transparent;color:var(--ink);padding:8px 0;outline:none;font-variant-numeric:tabular-nums}
.field .u{color:var(--muted);font-size:.95rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 20px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.note{margin-top:16px;border-radius:8px;padding:12px 14px;font-size:.95rem}
.note.hint{background:var(--hint-bg)}
.note.good{background:var(--good-bg)}
.note.bad{background:var(--bad-bg)}
.note b{font-family:var(--display)}
.sol{margin-top:10px;color:var(--muted);font-size:.92rem}
.sol b{color:var(--ink)}

/* end */
.score{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1.4rem;color:var(--muted);font-weight:500}
.stars{font-size:1.8rem;letter-spacing:.15em;color:var(--hot);margin:8px 0 14px}
.break{display:grid;gap:8px;margin:16px 0 4px;padding:0;list-style:none}
.break li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.break b{font-variant-numeric:tabular-nums}
@media (max-width:480px){
  .lvl{grid-template-columns:40px 1fr}.lvl .go{display:none}
  .panel{padding:16px}.q{font-size:1.1rem}
  .field input{width:7.5ch}
}
@media (prefers-reduced-motion:no-preference){
  .tick{transition:transform .15s,background .15s}
}
</style>

<main>
  <section id="start">
    <div class="eyebrow">7th grade · proportions</div>
    <h1>Ratio Rally</h1>
    <p class="lede">Six questions per level, easiest to hardest. Numbers change every round, so play again for fresh problems. Keep scratch paper handy.</p>
    <div class="levels">
      <button class="lvl" data-mode="0"><span class="n">1</span><span><b>Warm-Up</b><span class="d">Missing values, scaling recipes, unit rates</span></span><span class="go">6 questions</span></button>
      <button class="lvl" data-mode="1"><span class="n">2</span><span><b>Building Skills</b><span class="d">Constants of proportionality, rates, better buys, ratio parts</span></span><span class="go">6 questions</span></button>
      <button class="lvl" data-mode="2"><span class="n">3</span><span><b>Challenge</b><span class="d">Fraction rates, comparing speeds, scale maps</span></span><span class="go">6 questions</span></button>
      <button class="lvl all" data-mode="all"><span class="n">1-3</span><span><b>Full run</b><span class="d">All three levels in order</span></span><span class="go">18 questions</span></button>
    </div>
  </section>

  <section id="play" hidden>
    <div class="bar">
      <div class="stats">
        <div class="stat"><small>Score</small><b id="sScore">0</b></div>
        <div class="stat hot"><small>Streak</small><b id="sStreak">0</b></div>
      </div>
      <button class="quit" id="quit" type="button">Quit to menu</button>
    </div>
    <div class="line" id="line" aria-hidden="true"></div>
    <div class="panel">
      <div class="qmeta" id="qmeta"></div>
      <p class="q" id="qtext"></p>
      <form class="answer" id="form" autocomplete="off">
        <label for="ans">Your answer</label>
        <div class="field"><input id="ans" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="u" id="unit"></span></div>
      </form>
      <div class="actions">
        <button class="btn" id="check" type="button">Check</button>
        <button class="btn ghost" id="hintBtn" type="button">Show hint</button>
        <button class="btn" id="next" type="button" hidden>Next</button>
      </div>
      <div id="fb" aria-live="polite"></div>
    </div>
  </section>

  <section id="end" hidden>
    <div class="panel">
      <div class="eyebrow">Round complete</div>
      <div class="score"><span id="eScore">0</span><small> / <span id="eMax">0</span></small></div>
      <div class="stars" id="eStars" aria-hidden="true"></div>
      <p id="eMsg" class="lede" style="margin-top:0"></p>
      <ul class="break" id="eBreak"></ul>
      <div class="actions">
        <button class="btn" id="again" type="button">Play again with new numbers</button>
        <button class="btn ghost" id="menu" type="button">Choose a level</button>
      </div>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[R(0,a.length-1)];
const gcd = (a,b) => b ? gcd(b,a%b) : a;
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=R(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fr = (n,d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const num = n => Number.isInteger(n) ? String(n) : String(Math.round(n*100)/100);
const usd = c => '$' + (c/100).toFixed(2);
const fracText = (n,d) => { const g=gcd(n,d); n/=g; d/=g; return d===1 ? String(n) : `${n}/${d}`; };

/* ---------- Question generators: { q, ans, unit, hint, sol, show } ---------- */

// Level 1
function gMissing(){
  const a=R(1,5), b=R(a+1,8), k=R(2,6), d=b*k, x=a*k;
  return { q:`Solve for x: ${fr(a,b)} = ${fr('x',d)}`, ans:x, unit:'',
    hint:`What number times ${b} gives ${d}? Do the same to ${a}.`,
    sol:`${d} ÷ ${b} = ${k}, so x = ${a} × ${k} = <b>${x}</b>.` };
}
function gRecipe(){
  const set = pick([['cups of flour','cookies'],['cups of rice','servings'],['tablespoons of honey','muffins'],['cups of oats','granola bars']]);
  const u=R(1,4), b=pick([6,8,12]), k=R(2,5), t=b*k, x=u*k;
  return { q:`A recipe uses ${u} ${set[0]} to make ${b} ${set[1]}. How many ${set[0]} are needed to make ${t} ${set[1]}?`, ans:x, unit:set[0].split(' ')[0],
    hint:`${t} is how many times as many as ${b}?`,
    sol:`${t} ÷ ${b} = ${k} times as many, so ${u} × ${k} = <b>${x}</b>.` };
}
function gPrice(){
  const item = pick(['notebooks','pens','pencil cases','juice boxes']);
  const n=R(3,8), p=R(2,9), m=R(n+1,12), tot=n*p;
  return { q:`${n} ${item} cost $${tot}. What is the cost of ${m} ${item}?`, ans:p*m, unit:'dollars',
    hint:`Find the cost of one first: ${tot} ÷ ${n}.`,
    sol:`One costs $${tot} ÷ ${n} = $${p}. Then ${m} × $${p} = <b>$${p*m}</b>.` };
}
function gPerMin(){
  const r=R(4,15), m=R(3,9), p=r*m;
  return { q:`A printer prints ${p} pages in ${m} minutes. How many pages does it print per minute?`, ans:r, unit:'pages',
    hint:`A unit rate means "per 1". Divide pages by minutes.`,
    sol:`${p} ÷ ${m} = <b>${r}</b> pages per minute.` };
}

// Level 2
function gTable(){
  const k=R(2,9); let xs=shuffle([1,2,3,4,5,6,7,8]).slice(0,3).sort((a,b)=>a-b);
  const row = f => xs.map(x=>`<td>${f(x)}</td>`).join('');
  return { q:`This table shows a proportional relationship. What is the constant of proportionality (the value of y ÷ x)?
    <table class="t"><tr><th>x</th>${row(x=>x)}</tr><tr><th>y</th>${row(x=>x*k)}</tr></table>`, ans:k, unit:'',
    hint:`Divide any y by its matching x.`,
    sol:`${xs[0]*k} ÷ ${xs[0]} = ${k}, and ${xs[1]*k} ÷ ${xs[1]} = ${k}. The constant is <b>${k}</b>.` };
}
function gDistance(){
  const s=R(4,9)*10, t1=R(2,4), t2=R(5,9)+0.5, d1=s*t1;
  return { q:`A car travels ${d1} miles in ${t1} hours at a constant speed. At this rate, how many miles will it travel in ${t2} hours?`, ans:s*t2, unit:'miles',
    hint:`Find the speed in miles per hour first.`,
    sol:`Speed: ${d1} ÷ ${t1} = ${s} mph. Then ${s} × ${t2} = <b>${num(s*t2)}</b> miles.` };
}
function gBuy(){
  const oz=pick([10,12,15,16,20,25]), c=R(18,45), price=c*oz;
  return { q:`A ${oz}-ounce jar of peanut butter costs ${usd(price)}. What is the price per ounce, in cents?`, ans:c, unit:'cents',
    hint:`Divide the price in cents by the number of ounces. ${usd(price)} is ${price} cents.`,
    sol:`${price} cents ÷ ${oz} ounces = <b>${c}</b> cents per ounce.` };
}
function gParts(){
  const [c1,c2]=pick([['blue','yellow'],['red','white'],['flour','sugar'],['sand','gravel']]);
  const a=R(1,5), b=R(a+1,8), per=R(3,9), tot=(a+b)*per, second=Math.random()<.5;
  return { q:`A mix uses ${c1} and ${c2} in a ratio of ${a}:${b}. How many quarts of ${second?c2:c1} are in ${tot} quarts of the mix?`, ans:(second?b:a)*per, unit:'quarts',
    hint:`Add the parts of the ratio, then find how big one part is.`,
    sol:`${a} + ${b} = ${a+b} parts. ${tot} ÷ ${a+b} = ${per} quarts per part. ${second?c2:c1}: ${second?b:a} × ${per} = <b>${(second?b:a)*per}</b>.` };
}

// Level 3
function gComplex(){
  let f1,f2; do { f1=pick([[1,2],[2,3],[3,4],[3,5],[1,3],[5,6]]); f2=pick([[1,4],[1,3],[1,5],[1,6],[1,2],[2,5]]); } while (f1[0]*f2[1]===f1[1]*f2[0]);
  const [a,b]=f1,[c,d]=f2, n=a*d, dd=b*c, ans=n/dd;
  const t = fracText(n,dd);
  return { q:`A snail crawls ${fr(a,b)} of a foot in ${fr(c,d)} of a minute. What is its speed in feet per minute? <span style="color:var(--muted);font-size:.9rem">(You can type a fraction like 8/3 or a decimal.)</span>`, ans, unit:'ft/min',
    hint:`Divide distance by time: ${a}/${b} ÷ ${c}/${d}. Dividing by a fraction means multiplying by its flip.`,
    sol:`${a}/${b} ÷ ${c}/${d} = ${a}/${b} × ${d}/${c} = <b>${t}</b>${dd/gcd(n,dd)===1?'':` (about ${num(ans)})`} feet per minute.` };
}
function gCompare(){
  const mk = () => { const t=pick([12,15,20,24,30,40,45]), k=60/gcd(60,t), m=R(Math.ceil(6/k),Math.floor(24/k)), s=k*m; return {t,s,mi:s*t/60}; };
  let A=mk(),B=mk(); while (A.s===B.s) B=mk();
  const [n1,n2]=pick([['Sam','Leah'],['Jo','Marcus'],['Ava','Diego']]);
  return { q:`${n1} bikes ${A.mi} miles in ${A.t} minutes. ${n2} bikes ${B.mi} miles in ${B.t} minutes. How many miles per hour faster is the faster rider?`, ans:Math.abs(A.s-B.s), unit:'mph',
    hint:`Convert each rider to miles per hour. ${A.t} minutes is ${A.t}/60 of an hour.`,
    sol:`${n1}: ${A.mi} ÷ (${A.t}/60) = ${A.s} mph. ${n2}: ${B.mi} ÷ (${B.t}/60) = ${B.s} mph. Difference: <b>${Math.abs(A.s-B.s)}</b> mph.` };
}
function gTyping(){
  const r1=R(40,60), r2=R(28,r1-4), t1=R(2,5), t2=R(3,6), T=R(10,25), w1=r1*t1, w2=r2*t2;
  return { q:`Mia types ${w1} words in ${t1} minutes. Her friend types ${w2} words in ${t2} minutes. If both keep typing at these rates for ${T} minutes, how many more words does Mia type than her friend?`, ans:(r1-r2)*T, unit:'words',
    hint:`Find each person's words per minute first.`,
    sol:`Mia: ${w1} ÷ ${t1} = ${r1} per minute. Friend: ${w2} ÷ ${t2} = ${r2} per minute. (${r1} − ${r2}) × ${T} = <b>${(r1-r2)*T}</b>.` };
}
function gScale(){
  const j=pick([5,6,7,9,10,11,13,14,15]), k=R(5,25), whole=Math.floor(j/4), rem=j%4;
  return { q:`On a map, ${fr(1,4)} inch represents ${k} miles. Two towns are ${whole} ${fr(rem,4)} inches apart on the map. How many miles apart are the towns?`, ans:j*k, unit:'miles',
    hint:`Change ${whole} ${rem}/4 inches into quarter-inches. How many ${'¼'}s fit?`,
    sol:`${whole} ${rem}/4 = ${j}/4 inches, which is ${j} quarter-inches. ${j} × ${k} = <b>${j*k}</b> miles.` };
}

const LEVELS = [
  { name:'Warm-Up', gens:[gMissing,gRecipe,gPrice,gPerMin] },
  { name:'Building Skills', gens:[gTable,gDistance,gBuy,gParts] },
  { name:'Challenge', gens:[gComplex,gCompare,gTyping,gScale] }
];
const PER = 6;

/* ---------- Answer parsing ---------- */
function parse(raw){
  let s = String(raw).trim().replace(/[$,]/g,'').replace(/[a-zA-Z%/]+(?=\s*$)/,m=>m).trim();
  // strip trailing unit words, but keep a/b fractions
  s = s.replace(/\s*[a-zA-Z][a-zA-Z\s\/]*$/,'').trim();
  let m;
  if ((m = s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/))) return +m[1] + (+m[2])/(+m[3]);
  if ((m = s.match(/^(-?\d*\.?\d+)\s*\/\s*(\d*\.?\d+)$/))) return (+m[2]) ? (+m[1])/(+m[2]) : NaN;
  if (/^-?\d*\.?\d+$/.test(s)) return parseFloat(s);
  return NaN;
}

/* ---------- Game state ---------- */
let G = null;
const screens = { start:$('#start'), play:$('#play'), end:$('#end') };
function show(id){ for (const k in screens) screens[k].hidden = (k!==id); window.scrollTo(0,0); }

function build(mode){
  const idx = mode==='all' ? [0,1,2] : [+mode];
  const qs = [];
  for (const li of idx){
    const seq = [...shuffle(LEVELS[li].gens), ...shuffle(LEVELS[li].gens)].slice(0,PER);
    seq.forEach(g => qs.push({ lvl:li, d:g(), status:null, pts:0 }));
  }
  return { mode, qs, i:0, score:0, streak:0, wrong:0, hint:false, done:false };
}
function start(mode){ G = build(mode); show('play'); renderQ(); }

function renderLine(){
  const el = $('#line'); el.innerHTML = '';
  G.qs.forEach((q,i) => {
    const t = document.createElement('span');
    t.className = 'tick' + (i===G.i?' cur':'') + (q.status==='first'?' g':q.status==='second'?' o':q.status==='miss'?' m':'')
      + (i>0 && G.qs[i-1].lvl!==q.lvl ? ' gap':'');
    el.appendChild(t);
  });
}
function renderStats(){ $('#sScore').textContent = G.score; $('#sStreak').textContent = G.streak; }

function renderQ(){
  const q = G.qs[G.i]; G.wrong=0; G.hint=false; G.done=false;
  $('#qmeta').textContent = `Level ${q.lvl+1} · ${LEVELS[q.lvl].name} · Question ${G.i%PER + 1} of ${PER}`;
  $('#qtext').innerHTML = q.d.q;
  $('#unit').textContent = q.d.unit;
  const inp = $('#ans'); inp.value=''; inp.disabled=false;
  $('#fb').innerHTML = '';
  $('#check').hidden=false; $('#hintBtn').hidden=false; $('#hintBtn').disabled=false; $('#next').hidden=true;
  renderLine(); renderStats(); inp.focus();
}

function finishQ(status, pts){
  const q = G.qs[G.i]; q.status=status; q.pts=pts; G.score+=pts; G.done=true;
  $('#ans').disabled=true; $('#check').hidden=true; $('#hintBtn').hidden=true;
  const nx=$('#next'); nx.hidden=false; nx.textContent = G.i===G.qs.length-1 ? 'See results' : 'Next question'; nx.focus();
  renderLine(); renderStats();
}

function check(){
  if (G.done) return;
  const q = G.qs[G.i], raw = $('#ans').value;
  if (!raw.trim()) { $('#fb').innerHTML = '<div class="note hint">Type an answer first.</div>'; return; }
  const v = parse(raw);
  if (Number.isNaN(v)) { $('#fb').innerHTML = '<div class="note hint">Enter a number, a decimal, or a fraction like 8/3.</div>'; return; }
  const ok = Math.abs(v - q.d.ans) <= 0.011;
  const sol = `<div class="sol"><b>How it works:</b> ${q.d.sol}</div>`;
  if (ok){
    const pts = Math.max(4, 10 - 3*(G.hint?1:0) - 3*G.wrong);
    let bonus = 0;
    if (G.wrong===0){ G.streak++; if (G.streak>=3) bonus = 1; } else G.streak = 0;
    finishQ(G.wrong===0?'first':'second', pts+bonus);
    $('#fb').innerHTML = `<div class="note good"><b>Correct.</b> +${pts+bonus} points${bonus?' (streak bonus)':''}.${sol}</div>`;
  } else if (G.wrong===0){
    G.wrong=1; G.streak=0; renderStats();
    $('#fb').innerHTML = `<div class="note bad"><b>Not quite.</b> Look at it again and try once more.</div><div class="note hint"><b>Hint:</b> ${q.d.hint}</div>`;
    $('#ans').select();
  } else {
    G.streak=0; finishQ('miss',0);
    $('#fb').innerHTML = `<div class="note bad"><b>The answer is ${q.d.ans && !Number.isInteger(q.d.ans) ? 'about ' + num(q.d.ans) : num(q.d.ans)}${q.d.unit?' '+q.d.unit:''}.</b>${sol}</div>`;
  }
}

function showHint(){
  if (G.done) return;
  G.hint = true;
  const q = G.qs[G.i];
  $('#fb').innerHTML = `<div class="note hint"><b>Hint:</b> ${q.d.hint} <span style="color:var(--muted)">(Using a hint lowers the points for this question.)</span></div>`;
  $('#ans').focus();
}

function next(){
  if (G.i < G.qs.length-1){ G.i++; renderQ(); } else results();
}

function results(){
  const max = G.qs.length*10, firsts = G.qs.filter(q=>q.status==='first').length;
  const acc = firsts / G.qs.length;
  const stars = acc>=.85 ? 3 : acc>=.55 ? 2 : acc>=.25 ? 1 : 0;
  $('#eScore').textContent = G.score; $('#eMax').textContent = max;
  $('#eStars').textContent = '★'.repeat(stars) + '☆'.repeat(3-stars);
  $('#eMsg').textContent = stars===3 ? 'Strong work. Try the next level or play again for new numbers.'
    : stars===2 ? 'Solid. Replay for fresh numbers and aim for more first-try answers.'
    : 'Keep practicing. The hints and worked solutions are there to help you spot the pattern.';
  const ul = $('#eBreak'); ul.innerHTML='';
  const idx = G.mode==='all' ? [0,1,2] : [+G.mode];
  idx.forEach(li => {
    const qs = G.qs.filter(q=>q.lvl===li), ok = qs.filter(q=>q.status!=='miss').length;
    const f = qs.filter(q=>q.status==='first').length;
    const row = document.createElement('li');
    row.innerHTML = `<span>Level ${li+1} · ${LEVELS[li].name}</span><b>${ok}/${qs.length} correct · ${f} on the first try</b>`;
    ul.appendChild(row);
  });
  show('end');
}

/* ---------- Wiring ---------- */
document.querySelectorAll('.lvl').forEach(b => b.addEventListener('click', () => start(b.dataset.mode)));
$('#check').addEventListener('click', check);
$('#hintBtn').addEventListener('click', showHint);
$('#next').addEventListener('click', next);
$('#form').addEventListener('submit', e => { e.preventDefault(); G.done ? next() : check(); });
$('#quit').addEventListener('click', () => show('start'));
$('#menu').addEventListener('click', () => show('start'));
$('#again').addEventListener('click', () => start(G.mode));
document.addEventListener('keydown', e => {
  if (e.key==='Enter' && G && !screens.play.hidden && G.done && document.activeElement!==$('#next')) { e.preventDefault(); next(); }
});
</script>

</body></html>
